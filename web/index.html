<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="color-scheme" content="light dark">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Interactive booth map viewer for Comipara 7. Search for creators and navigate their booth locations.">
  <meta name="theme-color" content="#fffdf8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#21192a" media="(prefers-color-scheme: dark)">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Comipara 7 Map">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Comipara 7 Booth Map</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      overscroll-behavior-x: none;
      touch-action: pan-y;
      background-color: #fffdf8;
    }

    @media (prefers-color-scheme: dark) {
      html, body {
        color-scheme: dark;
        background-color: #21192a;
      }
    }
  </style>
</head>
<body>
  <script>
    // Prompt the Flutter-generated service worker to cache all assets for offline usage
    window.addEventListener('load', () => {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.ready.then(() => {
          if (navigator.serviceWorker.controller) {
            navigator.serviceWorker.controller.postMessage('downloadOffline');
          }
        });
      }
    });
  </script>
  <script src="flutter_bootstrap.js?v=17" async></script>
</body>
</html>
